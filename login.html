<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BIXBERRY FX</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid #26384f;
      border-radius: 16px;
      background: #101e30;
    }

    h1 {
      text-align: center;
      color: #43e0b5;
    }

    p {
      text-align: center;
      color: #a9b8cc;
    }

    label {
      display: block;
      margin-top: 18px;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #344861;
      border-radius: 8px;
      background: #07111f;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #43e0b5;
      color: #07111f;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    a {
      color: #43e0b5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>BIXBERRY FX</h1>
    <p>Welcome back! Log in to your account.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">LOG IN</button>
    </form>

    <p id="message" role="status"></p>

    <p>
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>

    <p><a href="index.html">Back to homepage</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Use the SAME project URL and publishable key as signup.html.
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (
        SUPABASE_URL === "YOUR_SUPABASE_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        message.textContent =
          "Setup required: add your Supabase project URL and publishable key.";
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        message.textContent = "Login successful! Opening your dashboard...";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        message.textContent =
          error.message || "Login failed. Please try again.";
      }
    });
  </script>
</body>
</html>
