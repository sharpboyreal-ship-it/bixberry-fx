<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | BIXBERRY FX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid #26384f;
      border-radius: 16px;
      background: #101e30;
    }
    h1 { text-align: center; color: #43e0b5; }
    p { text-align: center; color: #a9b8cc; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #344861;
      border-radius: 8px;
      background: #07111f;
      color: white;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #43e0b5;
      color: #07111f;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 18px; overflow-wrap: anywhere; }
    a { color: #43e0b5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>BIXBERRY FX</h1>
    <p>Create your account</p>

    <form id="signupForm">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Password (at least 8 characters)</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">

      <button type="submit">CREATE ACCOUNT</button>
    </form>

    <p id="message" role="status"></p>
    <p>Already registered? <a href="login.html">Log in</a></p>
    <p><a href="index.html">Back to homepage</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Replace these placeholders with your Supabase project URL and publishable key.
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      if (
        SUPABASE_URL === "YOUR_SUPABASE_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        message.textContent = "Setup required: add your Supabase project URL and publishable key in this file.";
        return;
      }

      message.textContent = "Creating your account...";

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.href.replace("signup.html", "login.html")
          }
        });

        if (error) throw error;

        message.textContent = data.session
          ? "Account created successfully! You can now log in."
          : "Account request submitted. Check your email to confirm your account.";
      } catch (error) {
        message.textContent = error.message || "Something went wrong. Please try again.";
      }
    });
  </script>
</body>
</html>
